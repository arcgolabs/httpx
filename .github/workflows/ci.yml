name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"
      - "adapter/*/v*"
      - "dix/v*"
      - "fx/v*"
      - "middleware/v*"
      - "websocket/v*"

permissions:
  contents: read

jobs:
  workspace:
    name: workspace sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache-dependency-path: |
            go.sum
            adapter/*/go.sum
            dix/go.sum
            examples/go.sum
            fx/go.sum
            middleware/go.sum
            websocket/go.sum

      - name: Sync workspace
        run: go work sync

      - name: Verify workspace files are committed
        run: git diff --exit-code

  test:
    name: test (${{ matrix.module }})
    needs: workspace
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - adapter/std
          - adapter/gin
          - adapter/echo
          - adapter/fiber
          - dix
          - fx
          - middleware
          - websocket
          - examples
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache-dependency-path: |
            go.sum
            adapter/*/go.sum
            dix/go.sum
            examples/go.sum
            fx/go.sum
            middleware/go.sum
            websocket/go.sum

      - name: Test
        working-directory: ${{ matrix.module }}
        run: go test ./...

  lint:
    name: lint (${{ matrix.module }})
    needs: workspace
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - .
          - adapter/std
          - adapter/gin
          - adapter/echo
          - adapter/fiber
          - dix
          - fx
          - middleware
          - websocket
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache-dependency-path: |
            go.sum
            adapter/*/go.sum
            dix/go.sum
            fx/go.sum
            middleware/go.sum
            websocket/go.sum

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Lint
        working-directory: ${{ matrix.module }}
        run: golangci-lint run ./...

  release:
    name: github release
    needs:
      - test
      - lint
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${TAG_NAME} already exists."
            exit 0
          fi

          make_latest=false
          if [[ "${TAG_NAME}" == v* ]]; then
            make_latest=true
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --method POST \
            --field "tag_name=${TAG_NAME}" \
            --field "name=${TAG_NAME}" \
            --field "generate_release_notes=true" \
            --field "make_latest=${make_latest}"
